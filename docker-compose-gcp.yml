# MarketMesh AI — GCP e2-micro optimised compose (cloud deployment)
#
# Differences from docker-compose.yml:
#   - mem_limit set on both services to stay within 1 GB RAM + 2 GB swap
#   - start_period 120 s (e2-micro burstable CPU is slower at image startup)
#   - GCP_PROJECT_ID passed through so Firestore watchlist persistence works
#
# Cache:       L1 in-memory only — no Redis (saves ~128 MB RAM on e2-micro).
# Persistence: Firestore (cloud) via VM service account ADC — no key file needed.
#              Falls back to in-memory if GCP_PROJECT_ID is not set.
#
# .env is written by GitHub Actions from repository secrets on every deploy.
# Do NOT edit it manually on the VM.

services:

  # ── FastAPI orchestrator + 6 MCP stdio subprocesses ────────────────────────
  orchestrator:
    # Built and pushed to GHCR by GitHub Actions, then pulled here. The `build:`
    # block is kept so `docker compose build` still works locally; the VM deploy
    # pulls the tag instead, because building on an e2-micro takes 20-25 min
    # (layer export to a slow disk dominates) versus ~2 min to pull.
    # IMAGE_REPO / IMAGE_TAG come from .env; defaults keep local use working.
    image: ${IMAGE_REPO:-marketmesh}/orchestrator:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: marketmesh_orchestrator
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      # Firestore: GCP_PROJECT_ID from .env enables persistence.
      # On GCP VM, ADC credentials come from the instance metadata service automatically.
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
    networks: [appnet]
    restart: always
    mem_limit: 700m
    healthcheck:
      # Exit 1 when status is "degraded" (any MCP server dead) so the VM cron
      # watchdog detects it and runs docker compose restart orchestrator.
      test: ["CMD", "python", "-c",
             "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://localhost:8000/health')); sys.exit(0 if d['status']=='healthy' else 1)"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 5

  # ── Streamlit frontend ──────────────────────────────────────────────────────
  frontend:
    image: ${IMAGE_REPO:-marketmesh}/frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: marketmesh_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://orchestrator:8000
    depends_on:
      orchestrator:
        condition: service_started
    networks: [appnet]
    restart: always
    mem_limit: 250m

networks:
  appnet:
    driver: bridge
