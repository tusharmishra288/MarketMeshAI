# =============================================================================
# MarketMesh AI — Nginx reverse proxy config
#
# __DOMAIN__ is replaced by the deploy workflow via sed with the value of
# the DUCKDNS_DOMAIN secret (e.g. marketmeshai.duckdns.org).
#
# The deploy workflow copies this file, substitutes __DOMAIN__, enables the
# site, and runs certbot --keep-until-expiring automatically on every deploy.
#
# Manual install (if needed):
#   sudo cp deploy/gcp/nginx.conf /etc/nginx/sites-available/marketmesh
#   sudo sed -i "s/__DOMAIN__/marketmeshai.duckdns.org/g" /etc/nginx/sites-available/marketmesh
#   sudo ln -sf /etc/nginx/sites-available/marketmesh /etc/nginx/sites-enabled/marketmesh
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d marketmeshai.duckdns.org --non-interactive --agree-tos \
#        --register-unsafely-without-email
# =============================================================================

# HTTP — Let Certbot handle ACME challenges; redirect everything else to HTTPS
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main app (Certbot fills in ssl_certificate lines automatically)
server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Streamlit frontend — WebSocket support required
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # FastAPI orchestrator
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # API docs + health passthrough
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
