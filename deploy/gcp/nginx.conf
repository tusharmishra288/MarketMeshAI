# =============================================================================
# MarketMesh AI — Nginx base config (HTTP only)
#
# This file contains the HTTP server block only.
# Certbot (--nginx flag) appends the HTTPS server block and fills in
# ssl_certificate paths automatically when it runs during deploy.
#
# __DOMAIN__ is replaced by sed in the deploy workflow with the value of
# the DUCKDNS_DOMAIN secret (e.g. marketmeshai.duckdns.org).
#
# DO NOT add a listen 443 block here — nginx -t would fail before certbot
# has had a chance to install the certificate.
# =============================================================================

server {
    listen 80;
    server_name __DOMAIN__;

    # ACME challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Streamlit frontend — WebSocket support required
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # FastAPI orchestrator
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # API docs + health passthrough
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
