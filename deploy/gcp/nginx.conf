# =============================================================================
# MarketMesh AI — Nginx reverse proxy config
#
# Install on the GCP VM:
#   sudo cp deploy/gcp/nginx.conf /etc/nginx/sites-available/marketmesh
#   sudo ln -s /etc/nginx/sites-available/marketmesh /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a free TLS certificate (replace yourdomain.com):
#   sudo certbot --nginx -d yourdomain.com
#
# If you don't have a domain, access via IP directly on ports 8501 / 8000.
# =============================================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name yourdomain.com;

    # Let Certbot manage ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main app
server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # Certbot will fill in ssl_certificate and ssl_certificate_key
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Streamlit frontend — served at /
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;    # keep Streamlit WebSocket alive
    }

    # FastAPI backend — served at /api/
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # FastAPI docs + health endpoints
    location ~ ^/(docs|redoc|openapi.json|health)$ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
