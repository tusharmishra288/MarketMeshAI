version: '3.8'

# MarketMesh AI — Docker Compose (local development)
#
# Architecture:
#   orchestrator — FastAPI backend; spawns 6 MCP servers as stdio subprocesses
#   frontend     — Streamlit UI
#
# Cache:    L1 in-memory only (no Redis). Data is lost on container restart.
# Persistence: set GCP_PROJECT_ID in .env to enable Firestore watchlist/alerts.
#              Leave empty → in-memory fallback.
#
# MCP servers (americas, europe, asia_pacific, mena, analytics, economics) are
# NOT separate containers. They are Python subprocesses launched by the
# orchestrator at startup via the MCP stdio protocol.

services:

  # ── FastAPI orchestrator + 6 MCP stdio subprocesses ────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: marketmesh_orchestrator
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    networks:
      - stocknet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  # ── Streamlit frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: marketmesh_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://orchestrator:8000
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - stocknet
    restart: unless-stopped

networks:
  stocknet:
    driver: bridge
