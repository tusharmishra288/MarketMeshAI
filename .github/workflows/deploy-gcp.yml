name: 2 - Deploy to GCP

# ─────────────────────────────────────────────────────────────────────────────
# Runs automatically on every push to main, or manually from the Actions tab.
# Prerequisite: run "1 - Provision GCP VM" workflow at least once first.
#
# What this workflow does (in order):
#   1. Authenticate with GCP using service account
#   2. Look up VM external IP dynamically (no GCP_VM_IP secret needed)
#   3. SSH into VM → write /opt/marketmesh/.env from GitHub Secrets
#   4. SSH into VM → git pull + docker compose build + up
#   5. Health-check GET /health from the Actions runner
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
# ── Infrastructure (shared with provision workflow) ──────────────────────────
#   GCP_SA_KEY      Service-account JSON — same one used in provision workflow.
#   GCP_PROJECT_ID  GCP project ID (e.g. "marketmesh-ai-461023").
#   GCP_SSH_KEY     SSH private key (ed25519) — same one used in provision workflow.
#                   The VM username is hardcoded to "marketmesh" (set by provision).
#
# ── Application secrets (written to .env on VM at deploy time) ───────────────
#   FINNHUB_API_KEY     Finnhub real-time quotes    https://finnhub.io/register
#   ALPHA_VANTAGE_KEY   Fundamentals & search       https://www.alphavantage.co
#   MARKETAUX_API_KEY   News & sentiment            https://www.marketaux.com
#   FRED_API_KEY        US macro data               https://fred.stlouisfed.org
#   GROQ_API_KEY        Primary AI LLM              https://console.groq.com
#   GEMINI_API_KEY      Fallback AI LLM             https://aistudio.google.com
#
# Total secrets: 9  (3 infra + 6 app)
#
# LOCAL DEVELOPMENT: edit .env directly in the repo root — no GitHub Secrets
# needed. The file is .gitignore'd and never committed.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── Build images on the runner, push to GHCR ─────────────────────────────
  #
  # Why not build on the VM: an e2-micro has shared burstable vCPUs, 1 GB RAM and
  # a slow persistent disk, so an orchestrator build takes 20-25 min there (40 min
  # cold). A GitHub runner has 4 cores and an SSD, and its layer cache is not at
  # the mercy of the VM's disk pressure. The VM then only pulls (~2 min).
  #
  # Change detection: paths-filter compares against the previous commit on push
  # (github.event.before), so a multi-commit push is covered correctly.
  build:
    name: Build → push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to ghcr.io
    outputs:
      image_repo: ${{ steps.meta.outputs.repo }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need history for the diff below

      - name: Decide what changed
        id: changed
        run: |
          # On workflow_dispatch there is no event.before — build both.
          BEFORE='${{ github.event.before }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo 'No usable base commit — building both images.'
            echo 'orchestrator=true' >> $GITHUB_OUTPUT
            echo 'frontend=true'     >> $GITHUB_OUTPUT
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" ${{ github.sha }})
          echo "Changed files:"; echo "$CHANGED"
          echo "$CHANGED" | grep -qE '^(backend/|mcp_servers/|requirements\.txt|docker-compose)' \
            && echo 'orchestrator=true' >> $GITHUB_OUTPUT || echo 'orchestrator=false' >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -qE '^(frontend/|requirements\.txt|docker-compose)' \
            && echo 'frontend=true' >> $GITHUB_OUTPUT || echo 'frontend=false' >> $GITHUB_OUTPUT

      - name: Compute image coordinates
        id: meta
        run: |
          # GHCR requires a lowercase repository path; github.repository may not be.
          echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup needed

      # Both images are tagged with the commit SHA and with 'latest'. The deploy
      # pulls by SHA so it can never race with a newer push mid-deploy; 'latest'
      # exists so an unchanged image still resolves on the next deploy.
      - name: Build and push orchestrator
        if: steps.changed.outputs.orchestrator == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}/orchestrator:${{ github.sha }}
            ${{ steps.meta.outputs.repo }}/orchestrator:latest
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,scope=orchestrator,mode=max

      - name: Build and push frontend
        if: steps.changed.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}/frontend:${{ github.sha }}
            ${{ steps.meta.outputs.repo }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # An image that was not rebuilt has no tag for this SHA, so the deploy's
      # `docker compose pull` would 404. Re-tag latest → this SHA without a build.
      - name: Re-tag unchanged images to this SHA
        run: |
          for svc in orchestrator frontend; do
            case "$svc" in
              orchestrator) BUILT='${{ steps.changed.outputs.orchestrator }}' ;;
              frontend)     BUILT='${{ steps.changed.outputs.frontend }}' ;;
            esac
            if [ "$BUILT" != 'true' ]; then
              echo "$svc unchanged — re-tagging latest to ${{ github.sha }}"
              docker buildx imagetools create \
                --tag ${{ steps.meta.outputs.repo }}/$svc:${{ github.sha }} \
                ${{ steps.meta.outputs.repo }}/$svc:latest
            fi
          done

  deploy:
    name: Write .env → git pull → docker compose up
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Authenticate gcloud ───────────────────────────────────────────────
      - name: Authenticate gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ── Resolve VM IP dynamically (no GCP_VM_IP secret needed) ───────────
      - name: Get VM external IP
        id: vm_ip
        run: |
          IP=$(gcloud compute instances describe marketmesh-vm \
            --zone=us-central1-a \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "VM IP: $IP"

      # ── Update DuckDNS with current VM IP (idempotent, safe to run every deploy) ──
      # If IP hasn't changed DuckDNS still returns OK — no harm done.
      # Requires two secrets: DUCKDNS_TOKEN and DUCKDNS_DOMAIN (subdomain only,
      # e.g. "marketmesh" not "marketmesh.duckdns.org").
      - name: Update DuckDNS
        run: |
          DOMAIN=$(printf '%s' '${{ secrets.DUCKDNS_DOMAIN }}' | tr -d '[:space:]')
          TOKEN=$(printf '%s' '${{ secrets.DUCKDNS_TOKEN }}' | tr -d '[:space:]')
          IP="${{ steps.vm_ip.outputs.ip }}"
          RESPONSE=$(curl -fs --max-time 10 \
            "https://www.duckdns.org/update?domains=${DOMAIN}&token=${TOKEN}&ip=${IP}" \
            || echo "CURL_ERROR")
          echo "DuckDNS response: $RESPONSE"
          if [ "$RESPONSE" = "OK" ]; then
            echo "✅ DuckDNS updated: ${DOMAIN}.duckdns.org → ${IP}"
          else
            echo "⚠️ DuckDNS response was not OK — continuing deploy (IP unchanged)"
          fi

      # ── Write SSH private key ─────────────────────────────────────────────
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/marketmesh_gcp
          chmod 600 ~/.ssh/marketmesh_gcp
          ssh-keyscan -H ${{ steps.vm_ip.outputs.ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── Step 1: Write .env on VM from GitHub Secrets ─────────────────────
      #
      # LOCAL vs CLOUD differentiation:
      #   LOCAL  — developer edits .env directly in repo root; runs backend/frontend natively
      #   CLOUD  — this step writes /opt/marketmesh/.env from GitHub Secrets on every deploy;
      #            Docker Compose reads it via env_file: .env
      #
      # The single-quoted heredoc 'ENVEOF' prevents bash from expanding the values;
      # GitHub Actions expands ${{ secrets.X }} before the YAML reaches bash.
      #
      - name: Write .env on VM
        run: |
          ssh -i ~/.ssh/marketmesh_gcp \
              -o StrictHostKeyChecking=no \
              marketmesh@${{ steps.vm_ip.outputs.ip }} << 'ENDSSH'
          mkdir -p /opt/marketmesh
          cat > /opt/marketmesh/.env << 'ENVEOF'
          # ── MarketMesh AI — Cloud .env (auto-written by GitHub Actions) ──────
          # DO NOT edit manually on the VM — overwritten on every deploy.
          # To change a value: update the GitHub Secret → push to main.
          #
          # LOCAL DEVELOPMENT: edit .env in repo root directly (it is .gitignore'd).

          # ── API Keys ─────────────────────────────────────────────────────────
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_KEY=${{ secrets.ALPHA_VANTAGE_KEY }}
          MARKETAUX_API_KEY=${{ secrets.MARKETAUX_API_KEY }}
          FRED_API_KEY=${{ secrets.FRED_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

          # ── GCP / Firestore ───────────────────────────────────────────────────
          # CLOUD: set to project ID → Firestore persistence enabled.
          # LOCAL: leave empty → in-memory fallback (data lost on restart).
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}

          # ── Backend / Frontend ────────────────────────────────────────────────
          BACKEND_HOST=0.0.0.0
          BACKEND_PORT=8000
          STREAMLIT_PORT=8501

          # ── Background scheduler ──────────────────────────────────────────────
          UPDATE_INTERVAL_MINUTES=15
          BULK_DOWNLOAD_HOUR=2

          # ── Image coordinates (consumed by docker-compose-gcp.yml) ───────────
          # compose interpolates ${IMAGE_REPO}/${IMAGE_TAG} into the `image:` keys
          # and reads this .env from the project directory automatically. Without
          # these two lines compose falls back to its defaults and tries to pull
          # marketmesh/orchestrator:local, which exists nowhere. IMAGE_REPO is
          # already lowercased by the build job — GHCR rejects uppercase paths.
          IMAGE_REPO=${{ needs.build.outputs.image_repo }}
          IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          ENVEOF
          chmod 600 /opt/marketmesh/.env
          echo ".env written ($(wc -l < /opt/marketmesh/.env) lines)"
          ENDSSH

      # ── Step 2: Pull code + rebuild + restart ─────────────────────────────
      - name: Deploy application
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/marketmesh_gcp \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=60 \
              marketmesh@${{ steps.vm_ip.outputs.ip }} \
              "set -euo pipefail
               echo '=== MarketMesh AI deploy: '$(date)' ==='

               # ── Fix ownership (one-time, idempotent) ──────────────────────
               # vm-startup.sh clones as root; we SSH as marketmesh. Fix once.
               if [ -e /opt/marketmesh ] && [ \"\$(stat -c %U /opt/marketmesh)\" != \"\$(whoami)\" ]; then
                 sudo chown -R \"\$(whoami):\$(whoami)\" /opt/marketmesh
                 echo 'Ownership fixed → '$(whoami)
               fi

               # ── Ensure /opt/marketmesh is a valid git repo ────────────────
               # Re-clone if the directory is missing or not a git repo
               # (happens when startup script used wrong URL or repo was private)
               if [ ! -d /opt/marketmesh/.git ]; then
                 echo 'No valid git repo found — cloning fresh...'
                 sudo mkdir -p /opt/marketmesh
                 sudo chown \"\$(whoami):\$(whoami)\" /opt/marketmesh
                 git clone $REPO_URL /opt/marketmesh
               fi

               cd /opt/marketmesh

               # Ensure remote URL is correct (fixes stale clones from startup script)
               git remote set-url origin $REPO_URL

               # Trust this directory (cross-user ownership)
               git config --global --add safe.directory /opt/marketmesh

               # ── Pull latest code ──────────────────────────────────────────
               git fetch --all --prune
               git checkout $DEPLOY_BRANCH 2>/dev/null || git checkout -b $DEPLOY_BRANCH origin/$DEPLOY_BRANCH
               git reset --hard origin/$DEPLOY_BRANCH
               echo 'Code: '$(git rev-parse --short HEAD)' (branch: $DEPLOY_BRANCH)'

               # ── Ensure marketmesh user is in docker group (idempotent) ───
               # Group change takes effect on next login; use sudo for this session.
               sudo usermod -aG docker \"\$(whoami)\" 2>/dev/null || true

               # ── Prune stopped containers + dangling images ────────────────
               # No build cache to protect any more (images are built on the
               # runner), but keep this targeted rather than `system prune -f`
               # so pulled images in use are not removed.
               sudo docker container prune -f
               sudo docker image prune -f
               echo 'Disk after prune:' && df -h /

               # ── Pull prebuilt images from GHCR ────────────────────────────
               # Images are built on the GitHub runner and pushed to GHCR by the
               # `build` job, so nothing is compiled here. Building on this
               # e2-micro took 20-25 min (40 cold); pulling takes ~2 min. Both
               # images are tagged with this commit SHA — the build job re-tags
               # unchanged ones so the pull always resolves. Repo is public, so
               # no registry login is needed. -E preserves IMAGE_REPO/IMAGE_TAG
               # through sudo for compose interpolation.
               sudo -E docker compose -f docker-compose-gcp.yml pull

               # ── Start orchestrator only ───────────────────────────────────
               # Frontend depends_on is service_started so compose up won't block
               # on the health check; we manage that ourselves below.
               sudo -E docker compose -f docker-compose-gcp.yml up -d orchestrator

               # ── Wait for orchestrator to become healthy (up to 8 min) ─────
               # Note the loop can also run out while status is still 'starting':
               # with start_period 360 s plus 5 retries at 30 s, a genuinely
               # broken container cannot report 'unhealthy' until ~8.5 min, which
               # is beyond this loop. Falling through on a timeout would start the
               # frontend and report a successful deploy against a degraded
               # backend, so the post-loop check below treats anything other than
               # 'healthy' as a failure.
               echo 'Waiting for orchestrator health...'
               STATUS='starting'
               for i in \$(seq 1 48); do
                 STATUS=\$(sudo docker inspect --format='{{.State.Health.Status}}' marketmesh_orchestrator 2>/dev/null || echo 'starting')
                 echo \"  [\$i/48] \$STATUS\"
                 if [ \"\$STATUS\" = 'healthy' ]; then break; fi
                 if [ \"\$STATUS\" = 'unhealthy' ]; then
                   echo '--- orchestrator logs (last 80 lines) ---'
                   sudo docker logs --tail=80 marketmesh_orchestrator
                   exit 1
                 fi
                 sleep 10
               done

               if [ \"\$STATUS\" != 'healthy' ]; then
                 echo \"Orchestrator never became healthy (last status: \$STATUS).\"
                 echo '/health body:'
                 sudo docker exec marketmesh_orchestrator \
                   python -c \"import urllib.request;print(urllib.request.urlopen('http://localhost:8000/health').read().decode())\" \
                   || echo '  (could not read /health)'
                 echo '--- orchestrator logs (last 80 lines) ---'
                 sudo docker logs --tail=80 marketmesh_orchestrator
                 exit 1
               fi

               # ── Start frontend (orchestrator already healthy) ──────────────
               sudo -E docker compose -f docker-compose-gcp.yml up -d frontend

               sudo -E docker compose -f docker-compose-gcp.yml ps

               # ── Remove superseded images ──────────────────────────────────
               # Every deploy pulls a NEW commit-SHA tag, so the previous image
               # keeps its own tag and never becomes dangling — the `image prune -f`
               # above (dangling-only) will not touch it. When the VM built locally
               # a rebuild orphaned the old image and it was collected; pulling
               # tagged images removes that effect, so without this the 30 GB disk
               # fills after a handful of deploys and fails as an unrelated
               # "no space left on device".
               #
               # Runs AFTER both containers are up, so -a keeps the images now in
               # use and removes only superseded ones. Pruning before the pull
               # would instead discard layers the new image could have reused.
               sudo docker image prune -af
               echo 'Disk after image cleanup:' && df -h /

               # Record what we just deployed. No longer drives build decisions
               # (the build job uses github.event.before), but keeps a record on
               # the VM of which commit is actually running.
               git rev-parse HEAD > .last-deployed-sha

               echo '=== Deploy complete: '$(date)' ==='"
        timeout-minutes: 60

      # ── Step 3: Configure Nginx reverse proxy + SSL (idempotent) ────────────
      #
      # Copies deploy/gcp/nginx.conf from the already-cloned repo on the VM,
      # substitutes __DOMAIN__ with the real hostname, enables the site, and
      # runs certbot. Safe to repeat on every deploy:
      #   • apt install is a no-op if packages already present
      #   • nginx.conf is overwritten, keeping it in sync with the repo
      #   • --keep-until-expiring skips cert renewal if valid for >30 days
      #     (avoids Let's Encrypt rate-limit of 5 certs/domain/week)
      #
      # No nested heredoc — nginx.conf lives in the repo at deploy/gcp/nginx.conf
      # so the workflow step is a simple SSH quoted-string command.
      - name: Configure Nginx + SSL
        run: |
          ssh -i ~/.ssh/marketmesh_gcp \
              -o StrictHostKeyChecking=no \
              marketmesh@${{ steps.vm_ip.outputs.ip }} \
              "DOMAIN=${{ secrets.DUCKDNS_DOMAIN }}.duckdns.org
               echo '=== Nginx + SSL: '\$DOMAIN' ==='

               sudo apt-get install -y -q nginx certbot python3-certbot-nginx

               sudo cp /opt/marketmesh/deploy/gcp/nginx.conf /etc/nginx/sites-available/marketmesh
               sudo sed -i 's/__DOMAIN__/'\$DOMAIN'/g' /etc/nginx/sites-available/marketmesh
               sudo ln -sf /etc/nginx/sites-available/marketmesh /etc/nginx/sites-enabled/marketmesh
               sudo rm -f /etc/nginx/sites-enabled/default

               if sudo nginx -t 2>&1; then
                 sudo systemctl enable nginx
                 sudo systemctl reload nginx
                 echo 'Nginx reloaded OK'
               else
                 echo 'nginx -t failed — skipping reload'
               fi

               sudo certbot --nginx -d \"\$DOMAIN\" \
                   --non-interactive --agree-tos \
                   --register-unsafely-without-email \
                 && echo '✅ SSL cert OK for '\$DOMAIN \
                 || echo '⚠️  Certbot failed — HTTP still works; check DNS propagation'

               echo '=== Nginx + SSL done ==='"
        timeout-minutes: 5

      # ── Step 4: Install VM cron watchdog (idempotent) ────────────────────
      # Copies deploy/gcp/watchdog.sh → /usr/local/bin/marketmesh-watchdog
      # and installs a crontab entry that runs it every 5 minutes.
      # If /health returns "degraded" the script runs docker compose restart
      # orchestrator, which respawns all 6 MCP subprocesses fresh.
      - name: Install watchdog cron
        run: |
          ssh -i ~/.ssh/marketmesh_gcp \
              -o StrictHostKeyChecking=no \
              marketmesh@${{ steps.vm_ip.outputs.ip }} \
              "sudo cp /opt/marketmesh/deploy/gcp/watchdog.sh /usr/local/bin/marketmesh-watchdog
               sudo chmod +x /usr/local/bin/marketmesh-watchdog
               (crontab -l 2>/dev/null | grep -v marketmesh-watchdog; \
                echo '*/5 * * * * /usr/local/bin/marketmesh-watchdog >> /var/log/marketmesh-watchdog.log 2>&1') | crontab -
               echo '✅ Watchdog cron active:' && crontab -l | grep watchdog"

      # ── Step 5: Health check from Actions runner ──────────────────────────
      - name: Health check
        run: |
          IP=${{ steps.vm_ip.outputs.ip }}
          DOMAIN=${{ secrets.DUCKDNS_DOMAIN }}.duckdns.org
          echo "Checking http://$IP:8000/health (direct) and https://$DOMAIN/health (Nginx)"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://$IP:8000/health" || echo "000")
            echo "  Attempt $i: HTTP $CODE (direct)"
            [ "$CODE" = "200" ] && echo "✅ Health check passed." && \
              echo "  Frontend → https://$DOMAIN" && \
              echo "  API docs → https://$DOMAIN/docs" && exit 0
            sleep 15
          done
          echo "❌ Health check failed after 5 attempts."
          exit 1
