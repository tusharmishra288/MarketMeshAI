name: Deploy to GCP e2-micro

# Triggers:
#   - Push to main branch
#   - Manual trigger from GitHub Actions UI (workflow_dispatch)
on:
  push:
    branches: [main]
  workflow_dispatch:

# ── Required GitHub Secrets ────────────────────────────────────────────────────
#
# Go to: Settings → Secrets and variables → Actions → New repository secret
#
# ── Deployment secrets (SSH access) ──────────────────────────────────────────
#
#   GCP_VM_IP      External (static) IP of your e2-micro instance.
#                  Get it: gcloud compute instances describe marketmesh-vm \
#                    --zone=us-central1-a \
#                    --format='get(networkInterfaces[0].accessConfigs[0].natIP)'
#
#   GCP_VM_USER    OS username on the VM (your Google account local-part,
#                  e.g. "john" for john@gmail.com).
#                  Confirm: gcloud compute ssh marketmesh-vm --command="whoami"
#
#   GCP_SSH_KEY    Private SSH key in PEM format (-----BEGIN OPENSSH PRIVATE KEY-----)
#                  Generate: ssh-keygen -t ed25519 -f ~/.ssh/marketmesh_gcp
#                  Add pub key to VM:
#                    gcloud compute instances add-metadata marketmesh-vm \
#                      --zone=us-central1-a \
#                      --metadata ssh-keys="USER:$(cat ~/.ssh/marketmesh_gcp.pub)"
#                  Secret value: paste contents of ~/.ssh/marketmesh_gcp
#
# ── Application secrets (written to .env on VM at deploy time) ───────────────
#
#   FINNHUB_API_KEY      Finnhub real-time quotes  — https://finnhub.io/register
#   ALPHA_VANTAGE_KEY    Fundamentals & search      — https://www.alphavantage.co
#   MARKETAUX_API_KEY    News & sentiment           — https://www.marketaux.com
#   FRED_API_KEY         US macro data              — https://fred.stlouisfed.org
#   GROQ_API_KEY         Primary AI LLM             — https://console.groq.com
#   GEMINI_API_KEY       Fallback AI LLM            — https://aistudio.google.com
#   GCP_PROJECT_ID       GCP project ID (enables Firestore watchlist persistence)
#
# Total: 10 secrets (3 deployment + 7 application)
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  deploy:
    name: SSH deploy → GCP e2-micro
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout (gives diff visibility in the Actions log) ───────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Write .env from GitHub Secrets ────────────────────────────────────
      #
      # All API keys are stored as GitHub Secrets and written to /opt/marketmesh/.env
      # on the VM at deploy time. The .env file is never committed to the repo.
      #
      # LOCAL DEVELOPMENT: edit .env directly on your machine (see .env in repo
      # root for all available variables and comments).
      #
      # CLOUD (this step): GitHub Actions expands ${{ secrets.X }} before the YAML
      # reaches the shell, so the single-quoted heredoc delimiter 'ENVEOF' prevents
      # bash from re-interpreting the values (handles special chars safely).
      #
      - name: Write .env from GitHub Secrets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          script: |
            mkdir -p /opt/marketmesh
            cat > /opt/marketmesh/.env << 'ENVEOF'
            # ── MarketMesh AI — Cloud .env (written by GitHub Actions) ──────────
            # Do NOT edit this file manually on the VM — it is overwritten on every
            # deployment. Update the values via GitHub Secrets instead.

            # ── API Keys ──────────────────────────────────────────────────────────
            FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
            ALPHA_VANTAGE_KEY=${{ secrets.ALPHA_VANTAGE_KEY }}
            MARKETAUX_API_KEY=${{ secrets.MARKETAUX_API_KEY }}
            FRED_API_KEY=${{ secrets.FRED_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

            # ── GCP / Firestore ───────────────────────────────────────────────────
            # Set to your GCP project ID to enable Firestore watchlist persistence.
            # The VM service account provides ADC automatically — no key file needed.
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}

            # ── Redis (disabled on e2-micro — app uses in-memory L1 cache only) ──
            REDIS_HOST=
            REDIS_PORT=6379
            REDIS_PASSWORD=

            # ── PostgreSQL (not used on GCP — Firestore replaces this layer) ─────
            POSTGRES_USER=stockuser
            POSTGRES_PASSWORD=
            POSTGRES_DB=marketmesh
            POSTGRES_HOST=localhost
            POSTGRES_PORT=5432

            # ── Backend / Frontend ────────────────────────────────────────────────
            BACKEND_HOST=0.0.0.0
            BACKEND_PORT=8000
            STREAMLIT_PORT=8501

            # ── Background scheduler ──────────────────────────────────────────────
            UPDATE_INTERVAL_MINUTES=15
            BULK_DOWNLOAD_HOUR=2
            ENVEOF
            chmod 600 /opt/marketmesh/.env
            echo ".env written ($(wc -l < /opt/marketmesh/.env) lines)"

      # ── 3. Deploy via SSH ────────────────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          # Allow longer timeout — e2-micro CPU burst makes `docker build` slow
          command_timeout: 20m
          script: |
            set -euo pipefail

            echo "=== MarketMesh AI deploy: $(date) ==="
            cd /opt/marketmesh

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main
            echo "Code updated to: $(git rev-parse --short HEAD)"

            # Rebuild images and restart services
            docker compose -f docker-compose-gcp.yml build
            docker compose -f docker-compose-gcp.yml up -d

            # Wait for orchestrator health (up to 3 minutes)
            echo "Waiting for orchestrator to be healthy..."
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' marketmesh_orchestrator 2>/dev/null || echo "starting")
              echo "  [$i/18] orchestrator status: $STATUS"
              [ "$STATUS" = "healthy" ] && break
              sleep 10
            done

            # Print final status
            docker compose -f docker-compose-gcp.yml ps
            echo "=== Deploy complete: $(date) ==="

      # ── 4. Post-deploy health check from the Actions runner ─────────────────
      - name: Verify health endpoint
        run: |
          echo "Checking /health on ${{ secrets.GCP_VM_IP }}:8000 ..."
          for i in 1 2 3 4 5; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
                   --max-time 10 \
                   "http://${{ secrets.GCP_VM_IP }}:8000/health" || echo "000")
            echo "  Attempt $i: HTTP $HTTP"
            [ "$HTTP" = "200" ] && echo "Health check passed." && exit 0
            sleep 15
          done
          echo "Health check failed after 5 attempts."
          exit 1
